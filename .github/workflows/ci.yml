name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        env:
          VITE_SITE_URL: https://didogi.ir/landing
          VITE_APP_URL: https://didogi.ir
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            --build-arg BASE_REGISTRY=docker.io/library --build-arg NPM_REGISTRY= \
            --build-arg VITE_SITE_URL=https://didogi.ir/landing \
            --build-arg VITE_APP_URL=https://didogi.ir \
            -t didogi-landing:ci .

  # Dokploy pulls git@github.com:didogi/landing.git on main (SSH).
  # Optional secret DOKPLOY_DEPLOY_WEBHOOK_URL forces a redeploy after green CI.
  deploy:
    name: Trigger Dokploy
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Call Dokploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No DOKPLOY_DEPLOY_WEBHOOK_URL — Dokploy Auto Deploy / git push handles CD."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK_URL"
          echo "Dokploy webhook triggered."
